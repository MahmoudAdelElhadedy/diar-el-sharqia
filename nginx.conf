server {
    listen 80;
    server_name diarelsharqia.com www.diarelsharqia.com;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/woff2
        font/woff
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache Control for Static Assets (Images, WebFonts, CSS, JS)
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|ico|jpg|jpeg|png|webp|svg|gif)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache Control for robots.txt and sitemap.xml
    location ~* (robots\.txt|sitemap\.xml)$ {
        expires 1d;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    # Cache Control for HTML (Never cache stale index.html)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    # Angular SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error Pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
