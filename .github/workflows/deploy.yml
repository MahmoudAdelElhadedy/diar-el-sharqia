name: Deploy Diar El Sharqia to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Angular Project for GitHub Pages
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "Building for GitHub Pages repository: $REPO_NAME"
          npx ng build --configuration production --base-href "/$REPO_NAME/"

      - name: Ensure 404.html is present in build output
        run: |
          if [ -f "public/404.html" ]; then
            cp public/404.html dist/diar-el-sharqia/browser/404.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/diar-el-sharqia/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
